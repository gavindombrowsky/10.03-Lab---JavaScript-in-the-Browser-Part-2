<!DOCTYPE html>
<html>
<head>
   <title>To-Do List</title>

   <style>
      body {
         font-family: Arial;
         background-color: #ddd;
      }

      li {
         display: flex;
         justify-content: space-between;
         width: 260px;
         margin: 10px 0;
      }

      .done-btn {
         border: none;
         background: none;
         cursor: pointer;
         font-size: 16px;
         color: gray;
      }
   </style>
</head>

<body>

<h1>To-Do List</h1>

<label>New task:</label>
<input type="text" id="new-task" value="Complete JavaScript lab">
<button id="add-btn">Add</button>

<ol>
   <li><span class="task-text">Clean bathroom</span><button class="done-btn">&#10006;</button></li>
   <li><span class="task-text">Study for big exam</span><button class="done-btn">&#10006;</button></li>
   <li><span class="task-text">Feed fish</span><button class="done-btn">&#10006;</button></li>
</ol>

<script src="script.js"></script>

</body>
</html>
